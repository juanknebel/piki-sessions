[package]
name = "piki-sessions"
version = "0.2.0"
edition = "2024"
license = "GPL-2.0"
description = "A tmux-style terminal multiplexer built on piki-multiplex."

[[bin]]
name = "pks"
path = "src/main.rs"

[dependencies]
piki-multiplex = { git = "https://github.com/juanknebel/piki-multiplex.git", tag = "v0.5.1", features = ["daemon", "sidecar"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }
anyhow = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
tui-term = "0.3"
vt100 = "0.16"

[patch.crates-io]
vt100 = { git = "https://github.com/juanknebel/piki-vt100", branch = "main" }
